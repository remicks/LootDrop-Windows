name: Announce completed releases to Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to check or announce (for example v0.7.11)
        required: true
        type: string
      dry_run:
        description: Validate assets without posting to Discord
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  announce:
    if: github.repository == 'remicks/LootDrop-Windows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out notification code only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Wait for finished uploads and announce without mentions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node .github/scripts/announce-release.mjs
